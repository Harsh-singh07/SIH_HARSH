<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a slot | Kisan Setu</title><link rel="stylesheet" href="/public/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/public/js/supabase-client.js"></script><script src="/public/js/auth.js"></script><script src="/public/js/api.js"></script><script src="/public/js/farmer.js?v=2"></script></head><body onload="initBooking()"><header class="topbar"><div class="shell"><a class="brand" href="/public/farmer-dashboard.html">Kisan <b>Setu</b></a></div></header><main class="auth" style="max-width:650px"><section class="card"><div class="eyebrow">New procurement visit</div><h1>Book your slot</h1><div class="steps"><i class="step active"></i><i class="step active"></i><i class="step active"></i><i class="step"></i></div><form onsubmit="book(event)"><div class="field"><label>Mandi centre</label><select id="centreSelect" onchange="loadSlots()" required></select></div><div class="field"><label>Date</label><input id="date" type="date" onchange="loadSlots()" required></div><div class="field"><label>Time slot</label><select id="slot" name="slot_id" required disabled><option value="">Choose a centre and date</option></select></div><div class="field"><label>Produce</label><select name="produce" required><option>Wheat</option><option>Paddy</option><option>Mustard</option></select></div><div class="field"><label>Estimated quantity (quintals)</label><input name="quantity" type="number" min="0.1" step="0.1" required></div><button class="btn success" type="submit" style="width:100%" disabled>Confirm booking</button></form></section></main></body></html>
