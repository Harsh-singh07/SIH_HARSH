<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Kisan Setu</title><link rel="stylesheet" href="/public/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/public/js/supabase-client.js"></script></head><body><header class="topbar"><div class="shell"><a class="brand" href="/public/index.html">Kisan <b>Setu</b></a></div></header><main class="auth"><section class="card"><div class="eyebrow">Farmer registration</div><h1>Start booking smarter</h1><div id="message" class="hidden"></div><form id="register"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Phone number</label><input name="phone" inputmode="tel" required></div><div class="field"><label>Create password</label><input type="password" name="password" minlength="8" required></div><button class="btn success" style="width:100%">Create farmer account</button></form><p class="muted">Already registered? <a href="/public/login.html">Sign in</a></p></section></main><script>document.querySelector('#register').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),phone=String(f.get('phone')).replace(/\D/g,''),o=document.querySelector('#message');const{error}=await supabaseClient.auth.signUp({email:phone+'@kisansetu.local',password:f.get('password'),options:{data:{name:f.get('name'),phone}}});o.className='notice'+(error?' error':'');o.textContent=error?supabaseErrorMessage(error):'Account created. You may now sign in.'}</script></body></html>
