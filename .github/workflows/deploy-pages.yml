name: Deploy Kisan Setu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build deployable site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          mkdir -p _site
          cp -R public admin index.html _site/
          touch _site/.nojekyll
          printf "window.KISAN_SETU_CONFIG = {\n  url: '%s',\n  publishableKey: '%s'\n};\n" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > _site/public/js/config.js
          REPO_BASE="/${GITHUB_REPOSITORY#*/}"
          find _site -type f \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 sed -i \
            -e "s|=\"/public/|=\"${REPO_BASE}/public/|g" \
            -e "s|=\"/admin/|=\"${REPO_BASE}/admin/|g" \
            -e "s|='/public/|='${REPO_BASE}/public/|g" \
            -e "s|='/admin/|='${REPO_BASE}/admin/|g" \
            -e "s|\"/public/|\"${REPO_BASE}/public/|g" \
            -e "s|\"/admin/|\"${REPO_BASE}/admin/|g" \
            -e "s|url=/public/|url=${REPO_BASE}/public/|g" \
            -e "s|url=/admin/|url=${REPO_BASE}/admin/|g"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
